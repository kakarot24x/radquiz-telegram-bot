name = "radquiz-bot"
main = "worker.js"
compatibility_date = "2025-01-01"

# Setup ke samay Cloudflare dashboard yahan KV namespace id bharne ko kahega
# (ya khud bana dega). ID milne par neeche wali line update ho jayegi.
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[[durable_objects.bindings]]
name = "QUIZ"
class_name = "QuizRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuizRoom"]
